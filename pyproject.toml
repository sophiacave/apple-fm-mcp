[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apple-fm-mcp"
version = "1.0.0"
description = "MCP server exposing Apple Foundation Models to Claude Code and Claude Desktop"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Sophie Cave", email = "hello@likeone.ai" }
]
keywords = ["mcp", "apple", "foundation-models", "claude", "ai", "on-device", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Operating System :: MacOS",
]
dependencies = [
    "mcp>=1.0.0",
    "apple-fm-sdk>=0.2.0",
]

[project.scripts]
apple-fm-mcp = "apple_fm_mcp.server:main"

[project.urls]
Homepage = "https://likeone.ai"
Repository = "https://github.com/sophiacave/apple-fm-mcp"
Documentation = "https://likeone.ai/blog/apple-foundation-models-swift-developer-guide-2026/"
